<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — CSI3210 PostHog Lab</title>
  <link rel="stylesheet" href="css/bookstore.css">
</head>
<body data-page="cart">
  <main>
    <div id="step-bar"></div>

    <h1>Your Cart</h1>
    <h2>Review your item before checking out</h2>

    <p style="font-size:0.82rem; color:#475569; margin-bottom:1.2rem;">
      PostHog event fired: <span class="badge" id="badge"></span>
    </p>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <p style="font-weight:700;" id="title"></p>
          <p style="color:#64748b; font-size:0.88rem;" id="author"></p>
        </div>
        <p style="font-weight:700; font-size:1.1rem;" id="price"></p>
      </div>
    </div>

    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <p style="font-weight:700;">Total</p>
      <p style="font-weight:700; font-size:1.2rem;" id="total"></p>
    </div>

    <div style="display:flex; gap:1rem; margin-top:1rem;">
      <a href="products.html" class="btn btn-secondary">← Back</a>
      <a href="checkout.html" class="btn btn-primary">Proceed to Checkout →</a>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
