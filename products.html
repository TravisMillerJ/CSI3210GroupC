<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Books — CSI3210 PostHog Lab</title>
  <link rel="stylesheet" href="css/bookstore.css">
</head>
<body data-page="products">
  <main>
    <div id="step-bar"></div>

    <h1>UX Design Books</h1>
    <h2>Pick a title to add to your cart</h2>

    <p style="font-size:0.82rem; color:#475569; margin-bottom:1.2rem;">
      PostHog events fired:
      <span class="badge">page_view {page: 'products'}</span>
      <span class="badge">viewed_product_list {count: <span id="product-count"></span>}</span>
    </p>

    <div id="product-list"></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
